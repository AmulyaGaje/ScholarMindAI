# =============================================================================
# ScholarMind AI – Docker Compose
# Orchestrates: PostgreSQL + FastAPI Backend + React Frontend
# =============================================================================

version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: scholarmind_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scholarmind}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Amulya@123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-scholarmind}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scholarmind_network

  # ---------------------------------------------------------------------------
  # FastAPI Backend
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scholarmind_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-Amulya@123}@db:5432/${POSTGRES_DB:-scholarmind}
      SECRET_KEY: ${SECRET_KEY:-7edd6ac048c6831c2aadd4dbd51425606224b43d61772b80aaa4b5657c74c2c5}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-50}
      APP_ENV: ${APP_ENV:-development}
      ALLOWED_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - scholarmind_network

  # ---------------------------------------------------------------------------
  # React Frontend (Development)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: scholarmind_frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
      VITE_APP_NAME: ScholarMind AI
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - scholarmind_network

# =============================================================================
# Volumes & Networks
# =============================================================================
volumes:
  postgres_data:
    name: scholarmind_postgres_data

networks:
  scholarmind_network:
    name: scholarmind_network
    driver: bridge
